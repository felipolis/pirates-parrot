[package]
name = "parrot-core"
description = "Audio capture, streaming speech recognition and model management for Pirate's Parrot."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
bzip2 = "0.6"
cpal = "0.18"
log = "0.4"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
sherpa-onnx = "2.0"
tar = "0.4"
tempfile = "3"
thiserror = "2"
ureq = "3"

[dev-dependencies]
serde_json = "1"
