name: Release

# On every push to `main`, release-please keeps a release pull request up to
# date with the next version and changelog, worked out from the Conventional
# Commits since the last release. Merging that pull request creates a draft
# release; this workflow then builds the installers for every platform,
# attaches them, publishes the release and redeploys the website.
#
# It is all one workflow because releases and tags created with the default
# GITHUB_TOKEN do not trigger other workflows.
on:
  push:
    branches: [main]

# Never cancel a release halfway through.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      id: ${{ steps.release.outputs.id }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5

  build:
    name: Build (${{ matrix.name }})
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ''
          - name: macOS (Apple silicon)
            os: macos-latest
            args: --target aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            args: --target x86_64-apple-darwin
          - name: Linux
            os: ubuntu-22.04
            args: ''
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev libxdo-dev
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          # Both macOS builds run on the same runner image; keep their caches apart.
          key: ${{ matrix.name }}
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.release-please.outputs.id }}
          args: ${{ matrix.args }}

  publish:
    name: Publish release
    needs: [release-please, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.release-please.outputs.id }}
        run: >
          gh api --method PATCH "repos/${{ github.repository }}/releases/$RELEASE_ID"
          -F draft=false -f make_latest=true

  website:
    name: Update the website
    needs: publish
    uses: ./.github/workflows/site.yml
    secrets: inherit
